name: Verifica statica Hub (senza runner NAS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nas/public-index.html'
      - 'nas/auto/index.html'
      - 'nas/media-manager.html'
      - '.github/workflows/verify-hub-nas.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verifica struttura Hub senza attendere runner Synology
        shell: bash
        run: |
          set -euo pipefail
          test -s nas/public-index.html
          test -s nas/auto/index.html
          test -s nas/media-manager.html
          grep -q 'profileAvatar' nas/public-index.html
          grep -q 'hubRefresh' nas/public-index.html
          grep -q 'profile-bogdan' nas/media-manager.html
          grep -q 'profile-camilla' nas/media-manager.html
          echo HUB_STATIC_CHECK_OK
