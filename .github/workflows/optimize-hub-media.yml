name: Ottimizza icone e foto Hub
on:
  push:
    branches: [main]
    paths:
      - 'nas/assets/home/*.png'
      - 'nas/auto/kia_rio.png'
      - 'nas/auto/fiat_punto.png'
      - 'scripts/optimize-hub-media.py'
      - '.github/workflows/optimize-hub-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-hub-artwork-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Crea WebP ottimizzati e aggiorna i riferimenti
        run: python scripts/optimize-hub-media.py
      - name: Pubblica automaticamente le immagini sul repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zenchak-hub-bot"
          git config user.email "zenchak-hub-bot@users.noreply.github.com"
          git add -A nas/assets/home nas/assets/car nas/public-index.html nas/auto/index.html nas/media-manager.html
          if ! git diff --cached --quiet; then
            git commit -m "Ottimizza icone Home e foto Auto in WebP con cache versionata [skip ci]"
            git push origin HEAD:main
          else
            echo "WebP già aggiornati: nessun commit necessario"
          fi
