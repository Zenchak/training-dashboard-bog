<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Accedi · Zenchack Hub</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#102238;--line:#274660;--text:#f4f8fc;--muted:#9bb0c4;--accent:#67e8f9;--danger:#ffb4ab}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#07111f,#0d2034);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.icon{font-size:42px;margin-bottom:10px}h1{font-size:25px;margin:0 0 7px}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin-bottom:22px}
button,a.btn{width:100%;min-height:52px;border-radius:15px;font:inherit;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.primary{border:0;background:var(--accent);color:#06202a}.fallback{margin-top:10px;border:1px solid var(--line);background:transparent;color:var(--text)}
.status{min-height:22px;margin-top:14px;color:var(--muted);font-size:13px;line-height:1.4}.status.err{color:var(--danger)}
.small{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<main class="card">
  <div class="icon">🔐</div>
  <h1>Zenchack Hub</h1>
  <div class="sub">Accedi con la passkey del tuo iPhone. Su iPhone la conferma avviene normalmente con Face ID.</div>
  <button class="primary" id="passkeyBtn" type="button">◉ Accedi con Face ID</button>
  <a class="btn fallback" href="/fallback/">Usa password / configura Face ID</a>
  <div class="status" id="status"></div>
  <div class="small">HTTPS · passkey WebAuthn · nessun dato biometrico lascia il dispositivo</div>
</main>
<script>
const statusEl=document.getElementById('status');
const btn=document.getElementById('passkeyBtn');
const b64uToBuf=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer};
const bufToB64u=buf=>{const a=new Uint8Array(buf);let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function json(url,opts){const r=await fetch(url,opts);let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||('Errore '+r.status));e.data=d;throw e}return d}
function credToJson(c){return{id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{clientDataJSON:bufToB64u(c.response.clientDataJSON),authenticatorData:bufToB64u(c.response.authenticatorData),signature:bufToB64u(c.response.signature),userHandle:c.response.userHandle?bufToB64u(c.response.userHandle):null}}}
(async()=>{try{const r=await fetch('/auth/me',{cache:'no-store'});if(r.ok)location.replace('/')}catch{}})();
btn.addEventListener('click',async()=>{
  statusEl.className='status';statusEl.textContent='Apro Face ID…';btn.disabled=true;
  try{
    if(!window.PublicKeyCredential)throw new Error('Questo browser non supporta le passkey.');
    const o=await json('/auth/login/options',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
    const pk={...o.publicKey,challenge:b64uToBuf(o.publicKey.challenge)};
    const cred=await navigator.credentials.get({publicKey:pk});
    if(!cred)throw new Error('Accesso annullato.');
    await json('/auth/login/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operationId:o.operationId,credential:credToJson(cred)})});
    statusEl.textContent='Accesso riuscito.';
    location.replace('/');
  }catch(e){
    statusEl.className='status err';
    statusEl.textContent=e?.data?.needsSetup?'Prima registra Face ID usando il pulsante “Usa password / configura Face ID”.':(e.message||'Accesso non riuscito.');
  }finally{btn.disabled=false}
});
</script>
</body>
</html>
