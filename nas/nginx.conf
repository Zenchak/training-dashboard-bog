server {
  listen 8081;
  server_name _;
  root /sites/training-dashboard-bog/dist;
  index index.html;
  # LAN fallback Hub and Finanze are materialized by build.js under dist/.
  location = /finanze-data.json {
    alias /private-finance/finance.json;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter '</body>' '<a href="https://$host/" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:11px 15px;border-radius:14px;background:rgba(8,22,38,.94);color:#fff;text-decoration:none;font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(0,0,0,.28);backdrop-filter:blur(10px)">🏠 Home</a></body>';
  }
}

server {
  listen 8082;
  server_name _;
  root /sites/race-map-bog;
  index index.html;

  # Pagina Gare pubblicata senza pulsanti Home aggiunti dal server.
  location = /app.html {
    try_files /app.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8083;
  server_name _;
  root /sites/cerco-casa;
  index index.html;

  location /api/notes {
    proxy_pass http://house-api:3000/api/notes;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/suggestions {
    proxy_pass http://house-api:3000/api/suggestions;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /grazie.html {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://house-api:3000/grazie.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/pending-suggestions.js?v=20260916-2220"></script><a href="https://$host/" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.96);color:#1f3d36;text-decoration:none;font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;border:1px solid rgba(31,111,95,.25);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(10px)">🏠 Home</a></body>';
  }
}

server {
  listen 8090;
  server_name _;
  absolute_redirect off;
  root /sites/training-dashboard-bog/nas;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Cache-Control "private, no-store" always;

  # Signed cookie session, valid for 30 days.
  # Protection is applied only to Hub content routes so the one-time
  # Basic Auth bootstrap can return its own 401/password prompt correctly.

  location = /_auth_check {
    internal;
    auth_request off;
    proxy_pass http://house-api:3000/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /_auth_bogdan {
    internal;
    auth_request off;
    proxy_pass http://house-api:3000/auth/check/bogdan;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /_auth_camilla {
    internal;
    auth_request off;
    proxy_pass http://house-api:3000/auth/check/camilla;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location @session_login {
    auth_request off;
    return 302 /login/;
  }
  location @profile_bogdan {
    auth_request off;
    return 302 /login/?switch=bogdan;
  }
  location @profile_camilla {
    auth_request off;
    return 302 /login/?switch=camilla;
  }

  # Login page and auth API stay reachable without an existing session.
  location = /login {
    auth_request off;
    return 302 /login/;
  }
  location = /login/ {
    auth_request off;
    try_files /login.html =404;
  }
  location = /auth/password/bogdan {
    auth_request off;
    if ($request_method != POST) { return 405; }
    auth_basic "Zenchak Hub · Bogdan";
    auth_basic_user_file /etc/nginx/.htpasswd_bogdan;
    proxy_pass http://house-api:3000/auth/password-login;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Auth-User $remote_user;
    proxy_set_header X-Auth-Target "Bogdan";
    proxy_set_header X-Auth-Password-Login "1";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /auth/password/camilla {
    auth_request off;
    if ($request_method != POST) { return 405; }
    auth_basic "Zenchak Hub · Camilla";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://house-api:3000/auth/password-login;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Auth-User $remote_user;
    proxy_set_header X-Auth-Target "Camilla";
    proxy_set_header X-Auth-Password-Login "1";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /auth/ {
    auth_request off;
    proxy_pass http://house-api:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Fallback "";
    proxy_set_header X-Auth-Target "";
    proxy_set_header X-Auth-Password-Login "";
  }

  # Old links no longer grant a session through cached HTTP Basic authentication.
  location = /fallback { return 302 /login/; }
  location = /fallback/ { return 302 /login/; }
  location = /fallback/bogdan { return 302 /login/?switch=bogdan; }
  location = /fallback/camilla { return 302 /login/?switch=camilla; }
  location = /fallback.html { return 302 /login/; }
  location = /login.html { return 302 /login/; }

  # Passkey area remains available as an optional test after normal login.
  location = /passkeys { return 302 /passkeys/; }
  location = /passkeys/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files /passkeys.html =404;
  }
  location = /passkey-test { return 302 /passkey-test/; }
  location = /passkey-test/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files /passkey-test.html =404;
  }
  location /passkey-api/ {
    auth_request off;
    proxy_pass http://house-api:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Fallback "";
    proxy_set_header X-Auth-Target "";
    proxy_set_header X-Auth-Password-Login "";
  }

  # Read-only machine feed retained for compatibility.
  location = /house-suggestions-feed-jDohLSn6APdAPYj0PjFyu7qtc4eQfxTs.json {
    auth_request off;
    proxy_pass http://127.0.0.1:8083/api/suggestions;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store" always;
  }

  location = / {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files /public-index.html =404;
  }
  # Private by default: every unlisted static path requires a real session.
  location / {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files $uri $uri/ =404;
  }


  location = /finanze {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    return 302 /finanze/;
  }
  location /finanze/ {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    try_files /finance.html =404;
  }
  location = /finance.html {
    auth_request /_auth_bogdan;
    error_page 401 = @session_login;
    error_page 403 = @profile_bogdan;
    try_files /finance.html =404;
  }
  location = /finance.enc {
    auth_request /_auth_bogdan;
    error_page 401 = @session_login;
    error_page 403 = @profile_bogdan;
    try_files /finance.enc =404;
  }
  location = /finanze-data.json {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    alias /private-finance/finance.json;
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
  }

  # Gestore media da smartphone: autenticazione uguale alle altre sezioni.
  location = /gestione-icone { return 302 /gestione-icone/; }
  location = /media-manager.html { return 302 /gestione-icone/; }
  location = /gestione-icone/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files /media-manager.html =404;
  }
  # Immagini personalizzate conservate in /data (volume persistente).
  location /media-file/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://house-api:3000/media-file/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location /api/media/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    client_max_body_size 8m;
    proxy_pass http://house-api:3000/api/media/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
  }

  location = /auto {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    return 302 /auto/;
  }
  location /auto/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    try_files $uri $uri/ /auto/index.html;
  }

  location = /training {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    return 302 /training/;
  }
  location /training/ {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }

  location = /gare {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    return 302 /gare/;
  }
  location /gare/ {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8082/app.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
  location = /feasibility.js {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8082/feasibility.js;
  }
  location = /extra-races.js {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8082/extra-races.js;
    add_header Cache-Control "no-store" always;
  }
  location /legacy/ {
    auth_request /_auth_bogdan;
    error_page 403 = @profile_bogdan;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8082/legacy/;
  }

  location = /casa {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    return 302 /casa/;
  }
  location /casa/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }
  location = /homes.js {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/homes.js;
  }
  location = /app.js {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/app.js;
  }
  location = /note-delete.js {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/note-delete.js;
  }
  location = /sort-priority.js {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/sort-priority.js;
  }
  location = /pending-suggestions.js {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/pending-suggestions.js;
  }
  location /api/ {
    auth_request /_auth_check;
    error_page 401 = @session_login;
    proxy_pass http://127.0.0.1:8083/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /grazie.html {
    proxy_pass http://127.0.0.1:8083/grazie.html;
  }
}
