server {
  listen 8081;
  server_name _;
  root /sites/training-dashboard-bog/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8082;
  server_name _;
  root /sites/race-map-bog;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8083;
  server_name _;
  root /sites/cerco-casa;
  index index.html;

  location /api/notes {
    proxy_pass http://house-api:3000/api/notes;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/suggestions {
    proxy_pass http://house-api:3000/api/suggestions;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /grazie.html {
    proxy_pass http://house-api:3000/grazie.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8090;
  server_name _;

  auth_basic "Bogdan NAS";
  auth_basic_user_file /etc/nginx/.htpasswd;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  location = / {
    root /etc/nginx/public;
    try_files /index.html =404;
  }

  location = /training { return 302 /training/; }
  location /training/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }

  location = /gare { return 302 /gare/; }
  location = /gare/ {
    proxy_pass http://127.0.0.1:8082/app.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
  location = /feasibility.js {
    proxy_pass http://127.0.0.1:8082/feasibility.js;
  }
  location /legacy/ {
    proxy_pass http://127.0.0.1:8082/legacy/;
  }

  location = /casa { return 302 /casa/; }
  location /casa/ {
    proxy_pass http://127.0.0.1:8083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }
  location = /homes.js {
    proxy_pass http://127.0.0.1:8083/homes.js;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:8083/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /grazie.html {
    proxy_pass http://127.0.0.1:8083/grazie.html;
  }
}
