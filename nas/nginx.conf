server {
  listen 8083;
  server_name _;
  root /sites/cerco-casa;
  index index.html;

  location /api/notes {
    proxy_pass http://house-api:3000/api/notes;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/suggestions {
    proxy_pass http://house-api:3000/api/suggestions;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /grazie.html {
    proxy_pass http://house-api:3000/grazie.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter '</body>' '<a href="https://nas-bogdan.tailnet-7e32.ts.net:8440/" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.96);color:#1f3d36;text-decoration:none;font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;border:1px solid rgba(31,111,95,.25);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(10px)">🏠 Home</a></body>';
  }
}

server {
  listen 8090;
  server_name _;
  root /sites/training-dashboard-bog/nas;

  auth_basic $zenchack_auth_realm;
  auth_basic_user_file /etc/nginx/.htpasswd_bogdan;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  location = /cambia-account {
    auth_basic off;

    if ($cookie_zenchack_switch = "1") {
      add_header Set-Cookie "zenchack_switch=; Path=/cambia-account; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
      return 302 /;
    }

    add_header Set-Cookie "zenchack_auth_realm=Zenchack-Hub-$request_id; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "zenchack_switch=1; Path=/cambia-account; Max-Age=60; Secure; HttpOnly; SameSite=Lax" always;
    add_header WWW-Authenticate "Basic realm=\"Zenchack-Hub-$request_id\"" always;
    return 401;
  }

  location = / {
    try_files /public-index.html =404;
  }

  location = /training { return 302 /training/; }
  location /training/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }

  location = /gare { return 302 /gare/; }
  location /gare/ {
    proxy_pass http://127.0.0.1:8082/app.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
  location = /feasibility.js {
    proxy_pass http://127.0.0.1:8082/feasibility.js;
  }
  location /legacy/ {
    proxy_pass http://127.0.0.1:8082/legacy/;
  }

  location = /casa {
    auth_basic "Cerco Casa";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    return 302 /casa/;
  }
  location /casa/ {
    auth_basic "Cerco Casa";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://127.0.0.1:8083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }
  location = /homes.js {
    auth_basic "Cerco Casa";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://127.0.0.1:8083/homes.js;
  }
  location /api/ {
    auth_basic "Cerco Casa";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://127.0.0.1:8083/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /grazie.html {
    auth_basic "Cerco Casa";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://127.0.0.1:8083/grazie.html;
  }
}
