server {
  listen 8083;
  server_name _;
  root /sites/cerco-casa;
  index index.html;

  location /api/notes {
    proxy_pass http://house-api:3000/api/notes;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/suggestions {
    proxy_pass http://house-api:3000/api/suggestions;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /grazie.html {
    proxy_pass http://house-api:3000/grazie.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter '</body>' '<script src="/pending-suggestions.js?v=20260916-2220"></script><a href="https://$host/" style="position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:11px 15px;border-radius:14px;background:rgba(255,255,255,.96);color:#1f3d36;text-decoration:none;font:700 14px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;border:1px solid rgba(31,111,95,.25);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(10px)">🏠 Home</a></body>';
  }
}

server {
  listen 8090;
  server_name _;
  root /sites/training-dashboard-bog/nas;

  # Passkey session gate. Public endpoints below explicitly disable auth_request.
  auth_request /_auth_check;
  error_page 401 = @login_redirect;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  location = /_auth_check {
    auth_request off;
    internal;
    proxy_pass http://house-api:3000/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location @login_redirect {
    auth_request off;
    return 302 /login/;
  }

  location = /login {
    auth_request off;
    return 302 /login/;
  }
  location = /login/ {
    auth_request off;
    try_files /login.html =404;
  }

  # Password fallback is used only to bootstrap/recover a passkey session.
  # The two old htpasswd files remain available as an emergency path.
  location = /fallback {
    auth_request off;
    return 302 /fallback/;
  }
  location = /fallback/ {
    auth_request off;
    try_files /fallback.html =404;
  }
  location = /fallback/bogdan {
    auth_request off;
    auth_basic "Zenchack Hub · Bogdan";
    auth_basic_user_file /etc/nginx/.htpasswd_bogdan;
    proxy_pass http://house-api:3000/auth/fallback;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-User $remote_user;
    proxy_set_header X-Auth-Fallback "1";
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /fallback/camilla {
    auth_request off;
    auth_basic "Zenchack Hub · Camilla";
    auth_basic_user_file /etc/nginx/.htpasswd_casa;
    proxy_pass http://house-api:3000/auth/fallback;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-User $remote_user;
    proxy_set_header X-Auth-Fallback "1";
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /passkeys {
    return 302 /passkeys/;
  }
  location = /passkeys/ {
    try_files /passkeys.html =404;
  }

  location /auth/ {
    auth_request off;
    proxy_pass http://house-api:3000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-User "";
    proxy_set_header X-Auth-Fallback "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
  }

  location = / {
    try_files /public-index.html =404;
  }

  location = /training { return 302 /training/; }
  location /training/ {
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }

  location = /gare { return 302 /gare/; }
  location /gare/ {
    proxy_pass http://127.0.0.1:8082/app.html;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
  }
  location = /feasibility.js {
    proxy_pass http://127.0.0.1:8082/feasibility.js;
  }
  location /legacy/ {
    proxy_pass http://127.0.0.1:8082/legacy/;
  }

  location = /casa { return 302 /casa/; }
  location /casa/ {
    proxy_pass http://127.0.0.1:8083/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
  }
  location = /homes.js {
    proxy_pass http://127.0.0.1:8083/homes.js;
  }
  location = /app.js {
    proxy_pass http://127.0.0.1:8083/app.js;
  }
  location = /note-delete.js {
    proxy_pass http://127.0.0.1:8083/note-delete.js;
  }
  location = /sort-priority.js {
    proxy_pass http://127.0.0.1:8083/sort-priority.js;
  }
  location = /pending-suggestions.js {
    proxy_pass http://127.0.0.1:8083/pending-suggestions.js;
  }
  location /api/ {
    proxy_pass http://127.0.0.1:8083/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /grazie.html {
    proxy_pass http://127.0.0.1:8083/grazie.html;
  }
}
