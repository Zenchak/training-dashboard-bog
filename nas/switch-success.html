<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account cambiato</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f4f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .box{text-align:center;padding:24px}.muted{color:#9bb0c4;font-size:14px;margin-top:8px}
  </style>
</head>
<body>
  <div class="box"><div>✅ Account cambiato</div><div class="muted">Torno all’Hub…</div></div>
  <script>
    fetch('/cambia-account-reset',{credentials:'same-origin',cache:'no-store'})
      .catch(()=>{})
      .finally(()=>location.replace('/'));
  </script>
</body>
</html>
