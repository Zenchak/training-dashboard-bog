<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Configura accesso · Zenchack Hub</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#102238;--line:#274660;--text:#f4f8fc;--muted:#9bb0c4;--accent:#67e8f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#07111f,#0d2034);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:7px 0 18px}h1{margin:0;font-size:24px}
a{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:58px;border:1px solid var(--line);border-radius:15px;color:var(--text);text-decoration:none;font-weight:850;padding:0 16px;margin-top:10px;background:#0b1a2b}a small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.back{justify-content:center;background:transparent;color:var(--muted);min-height:46px}
</style>
</head>
<body>
<main class="card">
  <h1>Chi stai configurando?</h1>
  <div class="sub">Inserirai la vecchia password solo questa volta; subito dopo registrerai la passkey con Face ID.</div>
  <a href="/fallback/bogdan"><span>👨</span><span>Bogdan<small>Configura / recupera Face ID</small></span></a>
  <a href="/fallback/camilla"><span>👩</span><span>Camilla<small>Configura / recupera Face ID</small></span></a>
  <a class="back" href="/login/">← Torna al login</a>
</main>
</body>
</html>
