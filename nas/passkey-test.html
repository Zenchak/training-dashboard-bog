<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Test Face ID · Zenchack Hub</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#102238;--line:#274660;--text:#f4f8fc;--muted:#9bb0c4;--accent:#67e8f9;--ok:#7ee2b8;--danger:#ffb4ab}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#07111f,#0d2034);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(470px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
h1{margin:0 0 7px;font-size:25px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:18px}.who{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#0b1a2b;margin-bottom:14px;font-size:13px;line-height:1.45}
.actions{display:grid;gap:10px}button,a.btn{width:100%;min-height:52px;border-radius:15px;font:inherit;font-weight:850;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.primary{border:0;background:var(--accent);color:#06202a}.secondary{border:1px solid var(--line);background:#0b1a2b;color:var(--text)}.back{border:1px solid var(--line);background:transparent;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{min-height:24px;margin:14px 0 2px;font-size:13px;line-height:1.45;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;line-height:1.5;color:var(--muted)}
@media(max-width:430px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
  <h1>🧪 Test Face ID</h1>
  <div class="sub">Area di prova separata: l’Hub principale continua a usare il login stabile finché questo test non è verificato.</div>
  <div class="who" id="who">Nessuna sessione passkey attiva.</div>
  <div class="actions">
    <div class="row">
      <a class="btn secondary" href="/passkey-test/bootstrap/bogdan">👨 Configura Bogdan</a>
      <a class="btn secondary" href="/passkey-test/bootstrap/camilla">👩 Configura Camilla</a>
    </div>
    <button class="primary" id="registerBtn" type="button">＋ Registra Face ID</button>
    <button class="secondary" id="loginBtn" type="button">◉ Prova accesso con Face ID</button>
    <a class="btn back" href="/">← Torna all’Hub</a>
  </div>
  <div class="status" id="status"></div>
  <div class="note">La biometria resta sull’iPhone. Il NAS salva solo la chiave pubblica della passkey.</div>
</main>
<script>
const who=document.getElementById('who'),statusEl=document.getElementById('status'),reg=document.getElementById('registerBtn'),login=document.getElementById('loginBtn');
const b64uToBuf=s=>{s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer};
const bufToB64u=buf=>{const a=new Uint8Array(buf);let s='';for(const b of a)s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function api(path,opts){const r=await fetch('/passkey-api/'+path,{cache:'no-store',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||('Errore '+r.status));e.data=d;throw e}return d}
function setStatus(msg,kind=''){statusEl.className='status'+(kind?' '+kind:'');statusEl.textContent=msg}
function regJson(c){return{id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{clientDataJSON:bufToB64u(c.response.clientDataJSON),attestationObject:bufToB64u(c.response.attestationObject),transports:c.response.getTransports?c.response.getTransports():[]}}}
function loginJson(c){return{id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{clientDataJSON:bufToB64u(c.response.clientDataJSON),authenticatorData:bufToB64u(c.response.authenticatorData),signature:bufToB64u(c.response.signature),userHandle:c.response.userHandle?bufToB64u(c.response.userHandle):null}}}
async function refresh(){
  try{const me=await api('me');who.textContent='Sessione passkey: '+me.user+' · passkey registrate: '+me.passkeys;return me}
  catch{who.textContent='Nessuna sessione passkey attiva. Prima premi “Configura Bogdan” o “Configura Camilla”.';return null}
}
reg.addEventListener('click',async()=>{
  reg.disabled=true;setStatus('Apro Face ID…');
  try{
    if(!window.PublicKeyCredential)throw new Error('Safari non supporta WebAuthn su questo dispositivo.');
    const o=await api('register/options',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
    const pk={...o.publicKey,challenge:b64uToBuf(o.publicKey.challenge),user:{...o.publicKey.user,id:b64uToBuf(o.publicKey.user.id)},excludeCredentials:(o.publicKey.excludeCredentials||[]).map(x=>({...x,id:b64uToBuf(x.id)}))};
    const c=await navigator.credentials.create({publicKey:pk});
    if(!c)throw new Error('Registrazione annullata.');
    const out=await api('register/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operationId:o.operationId,credential:regJson(c)})});
    setStatus('✓ Face ID registrato per '+out.user+'.','ok');await refresh();
  }catch(e){setStatus(e.message||'Registrazione non riuscita.','err')}
  finally{reg.disabled=false}
});
login.addEventListener('click',async()=>{
  login.disabled=true;setStatus('Richiedo Face ID…');
  try{
    if(!window.PublicKeyCredential)throw new Error('Safari non supporta WebAuthn su questo dispositivo.');
    const o=await api('login/options',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
    const pk={...o.publicKey,challenge:b64uToBuf(o.publicKey.challenge)};
    const c=await navigator.credentials.get({publicKey:pk});
    if(!c)throw new Error('Accesso annullato.');
    const out=await api('login/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({operationId:o.operationId,credential:loginJson(c)})});
    setStatus('✓ Face ID verificato: accesso riuscito come '+out.user+'.','ok');await refresh();
  }catch(e){setStatus(e.message||'Accesso non riuscito.','err')}
  finally{login.disabled=false}
});
refresh();
</script>
</body>
</html>
