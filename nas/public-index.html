<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenchack Hub</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#102238;--line:#274660;--text:#f4f8fc;--muted:#9bb0c4;--accent:#67e8f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#07111f,#0d2034);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(680px,100%)}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.headcopy{min-width:0}h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted)}.switch{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--text);background:#0b1a2b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:800;white-space:nowrap;transition:.15s}.switch:hover{border-color:var(--accent);transform:translateY(-1px)}.grid{display:grid;gap:12px}.card{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.15s}.card:hover{transform:translateY(-1px);border-color:var(--accent)}.title{font-weight:850;font-size:18px}.desc{color:var(--muted);font-size:13px;margin-top:4px}.foot{color:var(--muted);font-size:11px;margin-top:18px}@media(max-width:520px){.head{align-items:stretch;flex-direction:column}.switch{align-self:flex-start}}
</style>
</head>
<body><main class="wrap"><div class="head"><div class="headcopy"><h1>🏠 Zenchack Hub</h1><div class="sub">Accesso privato ai siti del NAS</div></div><a class="switch" href="/cambia-account">👤 Cambia account</a></div><div class="grid"><a class="card" href="/training/"><div class="title">📊 Allenamenti</div><div class="desc">Dashboard training e storico</div></a><a class="card" href="/gare/"><div class="title">🗺️ Gare</div><div class="desc">Mappa e calendario gare</div></a><a class="card" href="/casa/"><div class="title">🏡 Cerco Casa</div><div class="desc">Annunci, note e segnalazioni</div></a></div><div class="foot">Connessione HTTPS tramite Tailscale Funnel · login richiesto</div></main></body></html>
