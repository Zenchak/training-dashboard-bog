<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenchack Hub</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#102238;--line:#274660;--text:#f4f8fc;--muted:#9bb0c4;--accent:#67e8f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#07111f,#0d2034);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(680px,100%)}h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted);margin-bottom:20px}.grid{display:grid;gap:12px}.card{display:block;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.15s}.card:hover{transform:translateY(-1px);border-color:var(--accent)}.title{font-weight:850;font-size:18px}.desc{color:var(--muted);font-size:13px;margin-top:4px}.foot{color:var(--muted);font-size:11px;margin-top:18px}
</style>
</head>
<body><main class="wrap"><h1>🏠 Zenchack Hub</h1><div class="sub">Accesso privato ai siti del NAS</div><div class="grid"><a class="card" href="/training/"><div class="title">📊 Allenamenti</div><div class="desc">Dashboard training e storico</div></a><a class="card" href="/gare/"><div class="title">🗺️ Gare</div><div class="desc">Mappa e calendario gare</div></a><a class="card" href="/casa/"><div class="title">🏡 Cerco Casa</div><div class="desc">Annunci, note e segnalazioni</div></a></div><div class="foot">Connessione HTTPS tramite Tailscale Funnel · login richiesto</div></main></body></html>
