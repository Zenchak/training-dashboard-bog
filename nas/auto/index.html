<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Auto di famiglia · Zenchack</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--panel:#fff;--line:#e5eaf2;--text:#202938;--muted:#7d8898;--accent:#6f5cf1;--blue:#4f8cff;--green:#159f72;--amber:#c88217;--shadow:0 10px 30px rgba(42,55,85,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 8% 0%,rgba(111,92,241,.08),transparent 28rem),linear-gradient(180deg,#fbfcfe,#f4f7fb);min-height:100vh}
.wrap{width:min(1040px,100%);margin:auto;padding:18px 14px 64px}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:22px 22px;margin-bottom:14px;border:1px solid #edf0f6;border-radius:22px;background:linear-gradient(135deg,#fff,#fbfaff 68%,#f2efff);box-shadow:0 12px 36px rgba(50,61,92,.08)}
.hero:after{content:"";position:absolute;width:320px;height:320px;right:-145px;top:-205px;border-radius:50%;background:radial-gradient(circle,rgba(111,92,241,.16),transparent 66%);pointer-events:none}
.brand{position:relative;z-index:1;color:#6f5cf1;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:850}.hero h1{position:relative;z-index:1;margin:8px 0 5px;font-size:clamp(32px,6vw,48px);letter-spacing:-.04em;line-height:1}.hero p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:12px}
.actions{position:relative;z-index:2;display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:#596678;background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:10px 12px;font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.car-summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.car-summary h2{margin:8px 0 2px;font-size:22px}.eyebrow{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.meta{font-size:11px;color:var(--muted);line-height:1.5}.km{font-size:28px;font-weight:900;letter-spacing:-.035em;margin-top:14px}.km small{font-size:11px;color:var(--muted);font-weight:700}.status{display:inline-flex;margin-top:9px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;background:#eef7f4;color:var(--green)}.status.neutral{background:#f3f5f8;color:#667386}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.kpi{background:#f8f9fc;border:1px solid #edf0f5;border-radius:12px;padding:10px}.kpi b{display:block;font-size:16px}.kpi span{font-size:9px;color:var(--muted)}
.section{margin-top:16px}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 3px 8px}.section-title h3{margin:0;font-size:17px}.section-title span{font-size:10px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.situation{padding:14px 16px}.situation ul{margin:0;padding-left:18px}.situation li{margin:6px 0;color:#586577;font-size:12px;line-height:1.45}
.todo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.todo{padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff}.todo strong{display:block;font-size:12px}.todo p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.4}.todo.attention{border-color:#f0d6ad;background:#fffaf2}.todo.attention strong{color:#9a6312}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:top;font-size:11px}th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:#fafbfe}.date{white-space:nowrap;font-weight:800}.money{font-weight:850;white-space:nowrap}.shop{font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f3f5f9;color:#596678;font-size:9px;font-weight:750}.note{color:var(--muted);font-size:9px;margin-top:5px}
.estimate{padding:14px 16px}.estimate-top{display:flex;justify-content:space-between;gap:12px}.estimate-title{font-size:13px;font-weight:850}.estimate-meta{font-size:10px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;height:max-content;padding:5px 8px;border-radius:999px;background:#fff4df;color:#a76a13;font-size:9px;font-weight:850}.empty{padding:18px;color:var(--muted);font-size:11px}
.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);min-width:0}.admin-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.admin-ico{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#f4f2ff;font-size:16px}.admin-card h4{margin:0;font-size:13px}.admin-lead{font-size:11px;color:#4f5d70;line-height:1.45;margin:5px 0 9px}.info-list{display:grid;gap:6px}.info-row{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:10px;line-height:1.35}.info-row span:first-child{color:var(--muted);font-weight:750}.info-row span:last-child{color:#4f5d70;font-weight:700}.history{display:grid;gap:7px;margin-top:10px}.history-item{padding-top:7px;border-top:1px solid #edf0f5}.history-title{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:850}.history-sub{font-size:9px;color:var(--muted);line-height:1.4;margin-top:3px}.admin-card details{margin-top:10px}.admin-card summary{cursor:pointer;color:#596678;font-size:9px;font-weight:850}.admin-card .chips{margin-top:8px}.admin-note{font-size:9px;color:var(--muted);line-height:1.4;margin-top:8px}.oktag{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef7f4;color:var(--green);font-size:9px;font-weight:850}.warn{background:#fff4df;color:#a76a13}
.footer{margin:16px 3px 0;color:var(--muted);font-size:9px;line-height:1.45}
@media(max-width:720px){.wrap{padding:10px 10px 56px}.hero{padding:17px;border-radius:19px;align-items:flex-start}.hero h1{font-size:34px}.actions{flex-direction:column}.btn{padding:8px 9px;font-size:10px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.todo-grid,.admin-grid{grid-template-columns:1fr}.section{margin-top:13px}.car-summary{padding:14px}.km{font-size:25px}
.tablewrap{overflow:visible}table{min-width:0}thead{display:none}tbody,tr,td{display:block;width:100%}tr{padding:12px 13px;border-bottom:1px solid #edf0f5}td{border:0;padding:2px 0;font-size:10px}td:before{content:attr(data-label);display:inline-block;min-width:86px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.04em;font-weight:800}.chips{display:inline-flex;vertical-align:top;max-width:calc(100% - 90px)}.note{margin-left:90px}}

/* Interfaccia auto: panoramica e scheda veicolo */
:root{--navy:#101f52;--muted:#8290ae;--blue:#2365e8}
body{background:#f8faff;color:var(--navy)}
.wrap{max-width:940px;padding:24px 16px 80px}
.hero{background:transparent;border:0;box-shadow:none;border-radius:0;padding:0 0 24px;align-items:center;overflow:visible}
.hero:after,.brand{display:none}
.hero h1{font-size:clamp(27px,4vw,36px);margin:5px 0 4px;letter-spacing:-.035em}
.hero p{font-size:13px;color:var(--muted)}
.hero .actions{align-items:center}
.btn{border-radius:999px;background:#e9f1ff;border:0;color:#2554a8;font-size:13px;padding:12px}
.back-link{color:var(--navy);font-size:24px;text-decoration:none;margin-right:8px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.car-summary{position:relative;overflow:hidden;min-height:350px;border:0;box-shadow:none;padding:21px;border-radius:22px;background:linear-gradient(145deg,#eaf3ff,#f5faff 70%);display:flex;flex-direction:column}
.car-summary:nth-child(2){background:linear-gradient(145deg,#fff0ec,#fff8f6 70%)}
.car-summary h2{font-size:24px;position:relative;z-index:2;margin:0 0 3px}
.car-summary .meta{position:relative;z-index:2;font-size:12px;color:#7181a4}
.car-summary .car-picture{height:130px;display:grid;place-items:center;position:relative;overflow:hidden;margin:4px 0}
.car-picture .car-silhouette{font-size:105px;line-height:1;filter:drop-shadow(0 12px 9px rgba(25,38,73,.16));transform:scaleX(-1)}
.car-summary .km{font-size:17px;margin:8px 0 0;position:relative;z-index:2}
.car-summary .km small{font-size:10px}
.car-summary .status{align-self:flex-start;font-size:11px;margin:10px 0 0;padding:6px 11px}
.car-summary .status.neutral{background:#fff0d8;color:#bf6b00}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:13px 0}
.quick{border-radius:12px;background:rgba(255,255,255,.85);padding:10px 6px;min-width:0;color:var(--navy);font-size:10px;font-weight:800}
.quick svg{width:19px;height:19px;display:block;margin-bottom:5px;color:#2365e8}
.quick small{display:block;font-size:9px;font-weight:600;color:#7c8bab;margin:2px 0}
.quick strong{display:block;font-size:10px;overflow-wrap:anywhere}
.detail-btn{margin-top:auto;width:100%;background:rgba(255,255,255,.8);border:0;border-radius:12px;padding:13px;color:var(--navy);font-weight:800;cursor:pointer}
.car-view{display:none}.car-view.active{display:block}
.vehicle-header{text-align:center;position:relative}
.vehicle-header h2{font-size:28px;margin:0}.vehicle-header p{margin:0;color:var(--muted);font-size:13px}
.vehicle-visual{height:190px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#e9f2ff,transparent 75%);margin:8px 0}
.vehicle-visual .car-silhouette{font-size:155px;filter:drop-shadow(0 18px 11px rgba(30,50,90,.2));transform:scaleX(-1)}
.alert-strip{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:#fff6df;color:#ab5b00;margin:12px 0}
.alert-strip.ok{background:#eafaf1;color:#14804d}.alert-icon{font-size:25px}
.alert-strip strong{display:block;font-size:14px}.alert-strip small{display:block;font-size:11px;color:#78849a;margin-top:3px}
.vehicle-nav{display:grid;gap:8px;margin-top:16px}
.vehicle-nav button{display:flex;align-items:center;text-align:left;gap:12px;background:#fff;border:1px solid #e9edf5;border-radius:15px;padding:13px 15px;color:var(--navy);cursor:pointer;font:inherit}
.nav-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:#edf4ff;color:#2167e7;font-size:19px}
.vehicle-nav button:nth-child(2) .nav-icon{background:#f3eaff;color:#974be8}
.vehicle-nav button:nth-child(3) .nav-icon{background:#fff0e8;color:#ed7138}
.vehicle-nav button:nth-child(4) .nav-icon{background:#eaf2ff}
.vehicle-nav button:nth-child(5) .nav-icon{background:#fff2d7;color:#cb8900}
.nav-copy{flex:1}.nav-copy strong{display:block;font-size:13px}.nav-copy small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.detail-section{display:none;margin-top:18px}.detail-section.active{display:block}
.detail-section .section-title{margin:18px 0 10px}
.detail-section .admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.detail-section .panel{box-shadow:none}
.add-vehicle{display:block;width:100%;border:1px dashed #bad3ff;border-radius:15px;background:transparent;padding:16px;margin-top:14px;color:#1e4a9e;font-weight:800;cursor:pointer}
.section{margin-top:15px}
@media(max-width:720px){.wrap{padding:16px 12px 60px}.hero{padding-bottom:20px}.hero h1{font-size:28px}.grid{grid-template-columns:1fr;gap:12px}.car-summary{min-height:320px;padding:15px}.car-picture .car-silhouette{font-size:112px}.car-summary .car-picture{height:112px}.detail-section .admin-grid{grid-template-columns:1fr}.hero .actions .btn{padding:10px}}
.car-picture img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.vehicle-visual img{max-width:100%;width:380px;height:100%;object-fit:contain;mix-blend-mode:multiply}.car-summary .car-picture{height:150px}.vehicle-visual{height:230px}@media(max-width:720px){.car-summary .car-picture{height:135px}.vehicle-visual{height:205px}}
/* Fotografie auto: contenimento integrale senza tagli o zoom */
.car-summary{overflow:visible}
.car-summary .car-picture{height:170px;min-height:170px;overflow:visible;display:flex;align-items:center;justify-content:center;margin:8px 0 12px}
.car-summary .car-picture img{display:block;width:100%;max-width:100%;height:100%;object-fit:contain;object-position:center;mix-blend-mode:multiply}
.vehicle-visual{height:250px;overflow:visible;display:flex;align-items:center;justify-content:center}
.vehicle-visual img{display:block;width:100%;max-width:430px;height:100%;object-fit:contain;object-position:center;mix-blend-mode:multiply}
@media(max-width:720px){.car-summary .car-picture{height:155px;min-height:155px}.vehicle-visual{height:225px}}

/* Schede auto compatte: nome e descrizione affiancati */
.car-summary{min-height:0;padding:17px 18px}
.car-heading{display:grid;grid-template-columns:minmax(100px,0.85fr) minmax(0,1.5fr);gap:12px;align-items:start}
.car-heading h2{margin:0;font-size:23px;line-height:1.2}
.car-heading .meta{font-size:11px;line-height:1.45;padding-top:3px}
.car-summary .car-picture{height:145px;min-height:145px;margin:2px 0 5px}
.car-summary .status{margin:5px 0 0}
.car-summary .km{margin:6px 0 0}
.car-summary .quick-grid{margin:9px 0}
.car-summary .detail-btn{padding:11px}
@media(max-width:720px){.car-summary{min-height:0;padding:15px}.car-heading{grid-template-columns:minmax(95px,.8fr) minmax(0,1.6fr);gap:9px}.car-heading h2{font-size:21px}.car-summary .car-picture{height:135px;min-height:135px;margin:2px 0 5px}}
</style>

<body>
<main class="wrap">
<header class="hero"><div style="display:flex;align-items:center"><a class="back-link" href="/" aria-label="Torna alla Home">‹</a><div><h1 id="page-title">Auto di famiglia</h1><p id="page-subtitle">Veicoli, manutenzione e scadenze</p></div></div><div class="actions"><button class="btn" id="top-action" type="button" style="display:none" aria-label="Menu veicolo">⋮</button></div></header>
<div id="overview" class="car-view active"><section class="grid" id="summaries"></section></div>
<div id="vehicle" class="car-view"><div id="vehicle-content"></div></div>
<div class="footer">I dati provengono dallo storico registrato. Le scadenze non documentate sono indicate come da verificare; non equivalgono a pagamenti o revisioni mancanti.</div>
</main>
<script src="data.js"></script>
<script>
const DATA=window.AUTO_FAMILY_DATA||{cars:[]};
const euro=n=>n==null?'—':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const km=n=>n==null?'—':new Intl.NumberFormat('it-IT').format(n)+' km';
const date=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})};
const knownTotal=c=>c.maintenance.reduce((a,x)=>a+(Number.isFinite(x.amount)?x.amount:0),0);
const knownCosts=c=>c.maintenance.filter(x=>Number.isFinite(x.amount)).length;
const arr=v=>Array.isArray(v)?v:[];
function infoRows(items){return arr(items).map(x=>'<div class="info-row"><span>'+x.label+'</span><span>'+x.value+'</span></div>').join('')}
function historyRows(items, mapper){return arr(items).map(mapper).join('')}
function adminCards(c){
 const cards=[];
 if(arr(c.registry).length){
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">🚗</div><h4>Dati veicolo</h4></div><div class="info-list">'+infoRows(c.registry)+'</div></article>');
 }
 if(c.insurance){
   const i=c.insurance;
   const coverage=arr(i.coverages).map(x=>'<span class="chip">'+x+'</span>').join('');
   const hist=historyRows(i.history,x=>'<div class="history-item"><div class="history-title"><span>'+x.period+'</span><span>'+x.company+'</span></div><div class="history-sub">'+(x.note||'')+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">🛡️</div><h4>Assicurazione</h4></div><div class="admin-lead"><strong>'+i.company+'</strong> · '+date(i.validFrom)+' → '+date(i.validTo)+(i.graceUntil?'<br><span class="oktag">RCA iPatente fino al '+date(i.graceUntil)+' incl. comporto</span>':'')+'</div><div class="info-list"><div class="info-row"><span>Premio annuo</span><span>'+euro(i.premium)+'</span></div><div class="info-row"><span>Classe</span><span>'+i.classInfo+'</span></div></div><div class="chips">'+coverage+'</div><div class="admin-note">'+i.note+'</div>'+(hist?'<details><summary>Storico assicurativo trovato</summary><div class="history">'+hist+'</div></details>':'')+'</article>');
 }
 if(c.tax){
   const hist=historyRows(c.tax.history,x=>'<div class="history-item"><div class="history-title"><span>'+date(x.date)+'</span><span>'+(x.amount==null?'':euro(x.amount))+'</span></div><div class="history-sub">'+x.detail+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">🧾</div><h4>Bollo auto</h4></div><div class="admin-lead">'+c.tax.status+'</div><div class="history">'+hist+'</div><div class="admin-note">'+(c.tax.note||'')+'</div></article>');
 }
 if(arr(c.inspections).length){
   const hist=historyRows(c.inspections,x=>'<div class="history-item"><div class="history-title"><span>'+date(x.date)+(x.km!=null?' · '+km(x.km):'')+'</span><span class="oktag">'+x.result+'</span></div><div class="history-sub">'+(x.note||'')+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">🔎</div><h4>Revisioni</h4></div><div class="history">'+hist+'</div><div class="admin-note">Sono mostrati solo i dati trovati nel libretto/documenti collegati.</div></article>');
 }
 if(arr(c.permits).length){
   const current=c.permits[0];
   const rest=c.permits.slice(1);
   const currentHtml='<div class="admin-lead"><strong>'+current.type+'</strong><br>'+current.period+' · '+(current.amount==null?'':euro(current.amount)+' · ')+'<span class="oktag">'+current.status+'</span></div><div class="admin-note">'+current.note+'</div>';
   const hist=historyRows(rest,x=>'<div class="history-item"><div class="history-title"><span>'+x.period+'</span><span>'+x.status+'</span></div><div class="history-sub">'+x.type+(x.amount!=null?' · '+euro(x.amount):'')+' · '+(x.note||'')+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">🅿️</div><h4>Permessi · ZTL · sosta</h4></div>'+currentHtml+(hist?'<details><summary>Storico permessi e Area C</summary><div class="history">'+hist+'</div></details>':'')+'</article>');
 }
 if(arr(c.fines).length){
   const hist=historyRows(c.fines,x=>'<div class="history-item"><div class="history-title"><span>'+date(x.date)+' · '+x.authority+'</span><span>'+euro(x.amount)+'</span></div><div class="history-sub">'+x.detail+' · '+x.status+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">⚠️</div><h4>Multe / verbali</h4></div><div class="history">'+hist+'</div></article>');
 }
 if(arr(c.documents).length){
   const hist=historyRows(c.documents,x=>'<div class="history-item"><div class="history-title"><span>'+x.title+'</span></div><div class="history-sub">'+x.detail+'</div></div>');
   cards.push('<article class="admin-card"><div class="admin-head"><div class="admin-ico">📄</div><h4>Documenti trovati</h4></div><div class="history">'+hist+'</div></article>');
 }
 return cards.length?'<div class="section-title"><h3>Documenti e amministrazione</h3><span>assicurazione · bollo · revisioni · permessi · multe</span></div><div class="admin-grid">'+cards.join('')+'</div>':'';
}

const icons={
 wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 3a6 6 0 0 1-8 8L5 19a2 2 0 0 1-3-3l8-8a6 6 0 0 1 8-8l-4 4 3 3 4-4z"/></svg>',
 file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h8l5 5v15H6zM14 2v5h5M9 12h7M9 16h7"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 21 6v6c0 5-4 8-9 10-5-2-9-5-9-10V6z"/></svg>',
 calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 10h18"/></svg>'
};
function carPhoto(c){
 const slot=c.id==='kia-rio'?'auto-kia':'auto-fiat';
 const fallback=c.id==='kia-rio'?'kia_rio.png?v=847d763b':'fiat_punto.png?v=ee141e6e';
 const src=window.ZenchakMedia?.src(slot,fallback)||fallback;
 return '<img data-media-slot="'+slot+'" src="'+src+'" alt="'+c.name+'" loading="lazy" decoding="async">';
}
function quickCard(icon,label,value){return '<div class="quick">'+icons[icon]+'<small>'+label+'</small><strong>'+value+'</strong></div>'}
function statusText(c){return c.statusTone==='neutral'?'Da controllare':'In gestione'}
function summary(c){
 const card=document.createElement('article');card.className='car-summary';
 card.innerHTML='<div class="car-heading"><h2>'+c.name+'</h2><div class="meta">'+c.subtitle+'</div></div><div class="car-picture">'+carPhoto(c)+'</div><span class="status '+(c.statusTone==='neutral'?'neutral':'')+'">'+(c.statusTone==='neutral'?'⚠':'✓')+' '+statusText(c)+'</span><div class="km">'+km(c.currentKm)+'</div><div class="quick-grid">'+quickCard('wrench','Tagliando',c.maintenance.length+' interventi')+quickCard('file','Bollo',c.tax?'Vedi dati':'Da inserire')+quickCard('shield','Assicurazione',c.insurance?date(c.insurance.validTo):'Da inserire')+quickCard('calendar','Revisione',arr(c.inspections).length?'Vedi dati':'Da inserire')+'</div><button class="detail-btn" type="button">Vedi dettagli &nbsp; →</button>';
 card.querySelector('button').addEventListener('click',()=>openVehicle(c.id));
 return card;
}
function tableRows(c){return c.maintenance.map(x=>'<tr><td class="date" data-label="Data">'+date(x.date)+'</td><td data-label="Km">'+km(x.km)+'</td><td class="shop" data-label="Officina">'+(x.shop||'—')+'</td><td data-label="Lavori"><div class="chips">'+x.work.map(w=>'<span class="chip">'+w+'</span>').join('')+'</div>'+(x.note?'<div class="note">'+x.note+'</div>':'')+'</td><td class="money" data-label="Costo">'+euro(x.amount)+'</td></tr>').join('')}
function detailPanels(c){
 const todos=arr(c.next).map(x=>'<div class="todo '+(x.tone==='attention'?'attention':'')+'"><strong>'+x.title+'</strong><p>'+x.detail+'</p></div>').join('');
 const estimates=arr(c.estimates).map(x=>'<div class="estimate"><div class="estimate-title">'+x.title+'</div><div class="estimate-meta">'+date(x.date)+' · '+x.shop+' · '+euro(x.amount)+'</div><div class="note">'+x.note+'</div></div>').join('')||'<div class="empty">Nessun preventivo registrato.</div>';
 return {
 maintenance:'<div class="section-title"><h3>Manutenzione</h3><span>'+c.maintenance.length+' interventi</span></div><div class="panel tablewrap"><table><thead><tr><th>Data</th><th>Km</th><th>Officina</th><th>Intervento</th><th>Costo</th></tr></thead><tbody>'+tableRows(c)+'</tbody></table></div><div class="section-title"><h3>Prossimi interventi</h3></div><div class="todo-grid">'+todos+'</div><div class="section-title"><h3>Preventivi</h3></div><div class="panel">'+estimates+'</div>',
 deadlines:'<div class="section-title"><h3>Scadenze e documenti</h3></div>'+adminCards(c),
 documents:'<div class="section-title"><h3>Documenti e dati veicolo</h3></div>'+adminCards(c),
 costs:'<div class="section-title"><h3>Costi registrati</h3></div><div class="panel situation"><strong>Manutenzione: '+euro(knownTotal(c))+'</strong><p>'+knownCosts(c)+' interventi con costo registrato su '+c.maintenance.length+'.</p></div><div class="panel tablewrap"><table><thead><tr><th>Data</th><th>Km</th><th>Officina</th><th>Lavori</th><th>Costo</th></tr></thead><tbody>'+tableRows(c)+'</tbody></table></div>',
 notes:'<div class="section-title"><h3>Note e situazione</h3></div><div class="panel situation"><ul>'+arr(c.situation).map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="section-title"><h3>Da tenere d’occhio</h3></div><div class="todo-grid">'+todos+'</div>'
 };
}
function openVehicle(id){
 const c=DATA.cars.find(x=>x.id===id);if(!c)return;
 document.getElementById('overview').classList.remove('active');document.getElementById('vehicle').classList.add('active');
 document.getElementById('page-title').textContent=c.name;document.getElementById('page-subtitle').textContent='Auto di '+c.owner;
 document.querySelector('.back-link').onclick=e=>{e.preventDefault();showOverview()};
 document.getElementById('top-action').style.display='inline-flex';document.getElementById('top-action').textContent='⋮';document.getElementById('top-action').onclick=()=>{document.querySelector('[data-tab="notes"]').click()};
 const panels=detailPanels(c);
 const nav=[['maintenance','🔧','Manutenzione','Tagliandi, interventi e storico'],['deadlines','▣','Scadenze','Bollo, assicurazione, revisione e promemoria'],['documents','▤','Documenti','Libretto, assicurazione, ricevute, ecc.'],['costs','▱','Costi','Spese di gestione e storico costi'],['notes','▢','Note','Appunti personali e promemoria']];
 const urgent=c.statusTone==='neutral';
 document.getElementById('vehicle-content').innerHTML='<div class="vehicle-header"><div class="vehicle-visual">'+carPhoto(c)+'</div></div><div class="alert-strip '+(urgent?'':'ok')+'"><span class="alert-icon">'+(urgent?'❕':'✓')+'</span><div><strong>'+(urgent?'Da controllare':'In gestione')+'</strong><small>'+(urgent?'Alcuni interventi e scadenze da verificare.':'Consulta interventi e scadenze registrati.')+'</small></div></div><div class="quick-grid">'+quickCard('wrench','Tagliando',c.maintenance.length+' interventi')+quickCard('file','Bollo',c.tax?'Vedi dati':'Da inserire')+quickCard('shield','Assicurazione',c.insurance?date(c.insurance.validTo):'Da inserire')+quickCard('calendar','Revisione',arr(c.inspections).length?'Vedi dati':'Da inserire')+'</div><div class="vehicle-nav">'+nav.map(([id,ico,title,sub])=>'<button type="button" data-tab="'+id+'"><span class="nav-icon">'+ico+'</span><span class="nav-copy"><strong>'+title+'</strong><small>'+sub+'</small></span><span>›</span></button>').join('')+'</div>'+nav.map(([id])=>'<section class="detail-section" id="tab-'+id+'">'+panels[id]+'</section>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.tab;document.querySelectorAll('.detail-section').forEach(x=>x.classList.toggle('active',x.id==='tab-'+id));document.getElementById('tab-'+id).scrollIntoView({behavior:'smooth',block:'start'})}));
 history.replaceState(null,'','#'+id);window.scrollTo(0,0);
}
function showOverview(){document.getElementById('vehicle').classList.remove('active');document.getElementById('overview').classList.add('active');document.getElementById('page-title').textContent='Auto di famiglia';document.getElementById('page-subtitle').textContent='Veicoli, manutenzione e scadenze';document.querySelector('.back-link').onclick=null;document.getElementById('top-action').style.display='none';document.getElementById('top-action').onclick=null;history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}
document.getElementById('summaries').replaceChildren(...DATA.cars.map(summary));
if(location.hash){const id=location.hash.slice(1);if(DATA.cars.some(c=>c.id===id))openVehicle(id)}
</script>
</body>
</html>
