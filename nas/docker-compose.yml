services:
  updater:
    image: node:22-alpine
    container_name: bogdan-sites-updater
    restart: unless-stopped
    volumes:
      - sites_data:/sites
    command:
      - sh
      - -c
      - |
        apk add --no-cache git wget >/dev/null
        sync_repo() {
          name="$$1"
          url="$$2"
          if [ ! -d "/sites/$$name/.git" ]; then
            rm -rf "/sites/$$name"
            git clone --depth 1 "$$url" "/sites/$$name"
          else
            git -C "/sites/$$name" fetch origin main
            git -C "/sites/$$name" reset --hard origin/main
          fi
        }
        mirror_racemap() {
          target=/sites/race-map-bog/legacy
          if [ ! -f "$$target/index.html" ]; then
            echo "[$$(date)] Creo copia locale della vecchia mappa gare..."
            mkdir -p "$$target"
            wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
              --directory-prefix="$$target" \
              --no-host-directories \
              https://6a9fda04e5e971aba29f9a03--illustrious-cupcake-c1bcb0.netlify.app/ || true
            if [ ! -f "$$target/index.html" ]; then
              found=$$(find "$$target" -name 'index.html' | head -n 1)
              if [ -n "$$found" ]; then cp "$$found" "$$target/index.html"; fi
            fi
          fi
        }
        while true; do
          echo "[$$(date)] Aggiorno Zenchack Hub da GitHub..."
          sync_repo training-dashboard-bog https://github.com/Zenchak/training-dashboard-bog.git
          sync_repo race-map-bog https://github.com/Zenchak/race-map-bog.git
          sync_repo cerco-casa https://github.com/Zenchak/cerco-casa.git
          mirror_racemap
          if [ -f /sites/training-dashboard-bog/build.js ]; then
            node /sites/training-dashboard-bog/build.js || true
          fi
          echo "[$$(date)] Aggiornamento completato. Nuovo controllo tra 60 secondi."
          sleep 60
        done

  house-api:
    image: node:22-alpine
    container_name: bogdan-sites-house-api
    restart: unless-stopped
    depends_on:
      - updater
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - sites_data:/sites:ro
      - house_data:/data
    command:
      - sh
      - -c
      - |
        while [ ! -f /sites/cerco-casa/server.js ]; do sleep 2; done
        node /sites/cerco-casa/server.js

  web:
    image: nginx:1.27-alpine
    container_name: bogdan-sites-web
    restart: unless-stopped
    depends_on:
      - updater
      - house-api
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "127.0.0.1:8090:8090"
    volumes:
      - sites_data:/sites:ro
      - ./htpasswd_bogdan:/etc/nginx/.htpasswd_bogdan:ro
      - ./htpasswd_casa:/etc/nginx/.htpasswd_casa:ro
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        SRC=/sites/training-dashboard-bog/nas/nginx.conf
        DST=/etc/nginx/conf.d/default.conf
        while [ ! -s "$$SRC" ]; do
          echo "Attendo configurazione Nginx da GitHub..."
          sleep 2
        done
        cp "$$SRC" "$$DST"
        nginx -t
        nginx -g 'daemon off;' &
        NGINX_PID=$$!
        echo "Zenchack Hub web avviato. Controllo config automatico ogni 10 secondi."
        while kill -0 "$$NGINX_PID" 2>/dev/null; do
          sleep 10
          if [ -s "$$SRC" ] && ! cmp -s "$$SRC" "$$DST"; then
            echo "Nuova configurazione Nginx rilevata: verifico..."
            cp "$$DST" /tmp/default.conf.lastgood
            cp "$$SRC" "$$DST"
            if nginx -t; then
              nginx -s reload
              echo "Configurazione Nginx aggiornata automaticamente."
            else
              echo "Configurazione non valida: ripristino l'ultima versione funzionante."
              cp /tmp/default.conf.lastgood "$$DST"
            fi
          fi
        done
        wait "$$NGINX_PID"

volumes:
  sites_data:
  house_data:
